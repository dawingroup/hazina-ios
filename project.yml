# Generate the Xcode project with: brew install xcodegen && xcodegen
name: Hazina
options:
  bundleIdPrefix: app.hazina
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Hazina:
    type: application
    platform: iOS
    sources: [Hazina]
    info:
      path: Hazina/Info.plist
      properties:
        CFBundleDisplayName: Hazina
        NSFaceIDUsageDescription: Hazina uses Face ID to keep your family's wealth data private.
        UILaunchScreen: {}
        HAZINA_API_URL: $(HAZINA_API_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.hazina.ios
        HAZINA_API_URL: http://localhost:8080
  HazinaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HazinaTests]
    dependencies: [{ target: Hazina }]
schemes:
  Hazina:
    build: { targets: { Hazina: all } }
    test: { targets: [HazinaTests] }
